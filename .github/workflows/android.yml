name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            automake autopoint gettext libltdl-dev

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install git+https://github.com/kivy/buildozer
          python -m pip install legacy-cgi setuptools cython==0.29.34

      - name: Configure Buildozer
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("buildozer.spec")
          s = p.read_text()

          if "android.accept_sdk_license =" not in s:
              s = s.replace(
                  "[app]",
                  "[app]\nandroid.accept_sdk_license = True",
                  1
              )

          if "p4a.branch =" not in s:
              s = s.replace(
                  "[app]",
                  "[app]\np4a.branch = develop",
                  1
              )

          p.write_text(s)
          PY

          echo "===== BUILDOSER SETTINGS ====="
          grep -E "android.accept_sdk_license|p4a.branch|android.api|android.ndk" buildozer.spec

      - name: Prepare Android SDK, NDK and p4a
        run: |
          buildozer android p4a -- --help

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fouloulou-centipede-apk
          path: bin/*.apk
          if-no-files-found: error
