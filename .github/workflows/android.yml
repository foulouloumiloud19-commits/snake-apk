name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip build-essential autoconf automake \
            libtool pkg-config cmake \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 libffi-dev libssl-dev \
            libltdl-dev gettext autopoint patch ccache

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Buildozer and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.5.0
          python -m pip install legacy-cgi setuptools
          python -m pip install "Cython==3.1.8"

      - name: Create pygame-ce Android recipe
        run: |
          mkdir -p p4a-recipes/pygame-ce

          cat > p4a-recipes/pygame-ce/__init__.py <<'PY'
          from os.path import join

          from pythonforandroid.recipe import CompiledComponentsPythonRecipe
          from pythonforandroid.toolchain import current_directory


          class Pygame2Recipe(CompiledComponentsPythonRecipe):
              version = "2.5.7"
              url = "https://github.com/pygame-community/pygame-ce/archive/refs/tags/{version}.tar.gz"

              site_packages_name = "pygame-ce"
              name = "pygame-ce"

              depends = [
                  "sdl2",
                  "sdl2_image",
                  "sdl2_mixer",
                  "sdl2_ttf",
                  "setuptools",
                  "jpeg",
                  "png",
              ]

              hostpython_prerequisites = [
                  "setuptools",
                  "cython<=3.2.4",
              ]

              call_hostpython_via_targetpython = False
              install_in_hostpython = False

              def prebuild_arch(self, arch):
                  super().prebuild_arch(arch)

                  with current_directory(self.get_build_dir(arch.arch)):
                      setup_template = open(
                          join("buildconfig", "Setup.Android.SDL2.in")
                      ).read()

                      env = self.get_recipe_env(arch)
                      env["ANDROID_ROOT"] = join(
                          self.ctx.ndk.sysroot,
                          "usr"
                      )

                      png = self.get_recipe("png", self.ctx)
                      png_lib_dir = join(
                          png.get_build_dir(arch.arch),
                          ".libs"
                      )
                      png_inc_dir = png.get_build_dir(arch)

                      jpeg = self.get_recipe("jpeg", self.ctx)
                      jpeg_inc_dir = jpeg_lib_dir = jpeg.get_build_dir(
                          arch.arch
                      )

                      sdl_mixer_includes = ""
                      sdl2_mixer_recipe = self.get_recipe(
                          "sdl2_mixer",
                          self.ctx
                      )

                      for include_dir in sdl2_mixer_recipe.get_include_dirs(
                          arch
                      ):
                          sdl_mixer_includes += f"-I{include_dir} "

                      setup_file = setup_template.format(
                          sdl_includes=(
                              " -I"
                              + join(
                                  self.ctx.bootstrap.build_dir,
                                  "jni",
                                  "SDL",
                                  "include"
                              )
                              + " -L"
                              + join(
                                  self.ctx.bootstrap.build_dir,
                                  "libs",
                                  str(arch)
                              )
                              + " -L"
                              + png_lib_dir
                              + " -L"
                              + jpeg_lib_dir
                              + " -L"
                              + arch.ndk_lib_dir_versioned
                          ),
                          sdl_ttf_includes="-I"
                          + join(
                              self.ctx.bootstrap.build_dir,
                              "jni",
                              "SDL2_ttf"
                          ),
                          sdl_image_includes="-I"
                          + join(
                              self.ctx.bootstrap.build_dir,
                              "jni",
                              "SDL2_image",
                              "include"
                          ),
                          sdl_mixer_includes=sdl_mixer_includes,
                          jpeg_includes="-I" + jpeg_inc_dir,
                          png_includes="-I" + png_inc_dir,
                          freetype_includes="",
                      )

                      open("Setup", "w").write(setup_file)

              def get_recipe_env(self, arch):
                  env = super().get_recipe_env(arch)
                  env["USE_SDL2"] = "1"
                  env["PYGAME_CROSS_COMPILE"] = "TRUE"
                  env["PYGAME_ANDROID"] = "TRUE"
                  return env


          recipe = Pygame2Recipe()
          PY

      - name: Configure Buildozer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("buildozer.spec")
          s = p.read_text()

          keys = [
              "android.accept_sdk_license",
              "android.ndk",
              "android.ndk_api",
              "p4a.branch",
              "p4a.commit",
              "p4a.local_recipes",
          ]

          for key in keys:
              s = re.sub(
                  rf"(?m)^\s*#?\s*{re.escape(key)}\s*=.*\n?",
                  "",
                  s
              )

          settings = (
              "[app]\n"
              "android.accept_sdk_license = True\n"
              "android.ndk = 28c\n"
              "android.ndk_api = 24\n"
              "p4a.branch = develop\n"
              "p4a.commit = e772ad9\n"
              "p4a.local_recipes = ./p4a-recipes\n"
          )

          s = s.replace("[app]\n", settings, 1)

          p.write_text(s)
          PY

          echo "===== FINAL BUILD CONFIG ====="
          grep -E \
            "requirements|android.accept_sdk_license|android.api|android.minapi|android.ndk|android.ndk_api|p4a.branch|p4a.commit|p4a.local_recipes" \
            buildozer.spec

      - name: Prepare Android SDK, NDK and p4a
        run: |
          buildozer android p4a -- --help

      - name: Verify pygame-ce recipe
        run: |
          test -f p4a-recipes/pygame-ce/__init__.py
          grep -E 'version =|name = "pygame-ce"' p4a-recipes/pygame-ce/__init__.py

      - name: Build APK
        run: |
          buildozer android debug

      - name: Check APK
        run: |
          ls -lah bin/
          test -n "$(find bin -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fouloulou-centipede-apk
          path: bin/*.apk
          if-no-files-found: error
